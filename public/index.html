<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CryptoScope</title><style>
:root{font-family:Inter,system-ui,sans-serif;color-scheme:dark;background:#071018;color:#eaf2f8}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#071018,#0b1520);min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:16px}.top,.controls,.tabs,.pager{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.top{justify-content:space-between}.brand{font-size:24px;font-weight:850}.muted{color:#8ca1b3}.badge,.tag{border:1px solid #294054;border-radius:999px;padding:5px 8px;font-size:11px}.tabs{margin:16px 0 10px}.tab{flex:1;min-width:130px;background:#0e1924;border:1px solid #294054;color:#fff;padding:11px;border-radius:10px;font-weight:750}.tab.active{background:#17334a;border-color:#4d86ad}.warn{background:#241a0d;border:1px solid #5f441b;padding:11px;border-radius:12px;color:#f6d38f;font-size:12px}.controls{margin:12px 0}button,input,select{background:#101d29;color:#fff;border:1px solid #294054;border-radius:10px;padding:10px}.primary{background:#14b86a;border-color:#14b86a;color:#02130a;font-weight:800}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}.stat,.card{background:#0e1924;border:1px solid #203547;border-radius:14px;padding:13px}.stat b{display:block;font-size:19px;margin-top:4px}.cards{display:grid;gap:9px}.row{display:grid;grid-template-columns:1.25fr .75fr .7fr .7fr .7fr 1fr;gap:8px;align-items:center}.sym{font-size:19px;font-weight:850}.pill{display:inline-block;padding:5px 8px;border-radius:999px;font-size:11px;font-weight:800}.buy{background:#113c2a;color:#6af0a7}.watch{background:#3c3312;color:#f2d66c}.avoid{background:#441b24;color:#ff8ca3}.meter{height:6px;background:#1f3140;border-radius:999px;overflow:hidden}.meter i{display:block;height:100%;background:#5fc98b}.danger i{background:#ef6b7b}.details{display:none;margin-top:10px;border-top:1px solid #203547;padding-top:10px;font-size:13px;line-height:1.5}.card.open .details{display:block}.box{margin-top:9px;padding:10px;border-radius:10px;background:#101d29;border:1px solid #294054}.strong{border-color:#2d7e55;background:#0d251a}.wait{border-color:#66551d;background:#25200d}.stop{border-color:#71303d;background:#2b1118}.trendTable{width:100%;border-collapse:collapse}.trendTable th,.trendTable td{padding:9px;border-bottom:1px solid #203547;text-align:right;white-space:nowrap}.trendTable th:nth-child(2),.trendTable td:nth-child(2){text-align:left}.trendWrap{overflow:auto}.pos{color:#71e5a6}.neg{color:#ff8397}.pager{justify-content:center;margin:12px 0}@media(max-width:800px){.tabs{position:sticky;top:0;z-index:5;background:#071018;padding:6px 0}.grid{grid-template-columns:1fr 1fr}.row{grid-template-columns:1fr 1fr}.hideMob{display:none}.trendTable{font-size:12px}}
</style></head><body><div class="wrap"><div class="top"><div><div class="brand">📡 CryptoScope</div><div class="muted" id="subtitle">All-crypto scanner</div></div><div class="badge" id="stamp">Not scanned</div></div>
<div class="tabs"><button class="tab active" data-mode="all">🌐 All Crypto</button><button class="tab" data-mode="ph">🇵🇭 PH Trending</button><button class="tab" data-mode="global">🌍 Global Trending</button><button class="tab" data-mode="meme">🕷️ MemeWatch</button></div>
<div class="warn">Trending means popularity, not a buy signal. CryptoScope keeps trend rank separate from BUY/WATCH/AVOID analysis. Signals are heuristic and do not guarantee profit.</div>
<div class="controls"><button id="scan" class="primary">Run Scan</button><input id="search" placeholder="Search coin / symbol"><select id="category"><option value="">All categories</option></select><select id="action"><option value="">All signals</option><option>BUY CANDIDATE</option><option>WATCH</option><option>AVOID</option></select></div>
<div class="grid"><div class="stat"><span class="muted">Items</span><b id="count">—</b></div><div class="stat"><span class="muted">Buy candidates</span><b id="buys">—</b></div><div class="stat"><span class="muted">High risk</span><b id="rugs">—</b></div><div class="stat"><span class="muted">Avg quality</span><b id="quality">—</b></div><div class="stat"><span class="muted">Mode</span><b id="modeStat">All</b></div></div>
<div id="cards" class="cards"></div><div class="pager"><button id="prev">← Prev</button><span id="pageInfo" class="muted"></span><button id="next">Next →</button></div></div>
<script>
let items=[],mode='all',page=1,scanTime=null;const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function cls(a){return a==='BUY CANDIDATE'?'buy':a==='AVOID'?'avoid':'watch'}function numPct(s){if(!s)return null;const n=parseFloat(String(s).replace('%',''));return Number.isFinite(n)?n:null}function pctClass(s){const n=numPct(s);return n==null?'':n<0?'neg':'pos'}function addDays(n){const d=new Date(scanTime||Date.now());d.setDate(d.getDate()+n);return d.toLocaleDateString()}
function reasons(x){const r=[];r.push(`Opportunity ${x.opportunity??'—'}/100, risk ${x.risk??'—'}/100${x.quality!=null?`, quality ${x.quality}/100`:''}.`);if(x.confidence!=null)r.push(`Evidence confidence ${x.confidence}% from ${x.independentSources||0} sources.`);if(x.momentum>0)r.push(`Momentum is rising (+${x.momentum}).`);if(x.bullishSignals>0)r.push(`${x.bullishSignals} bullish catalyst(s) detected.`);if(x.bearishSignals>0)r.push(`${x.bearishSignals} bearish warning(s) detected.`);if(x.suspiciousSignals>0)r.push(`${x.suspiciousSignals} suspicious/rug-pattern signal(s) detected.`);return r}
function plan(x){const meme=mode==='meme'||(x.categories||[]).includes('Meme');if(x.action==='BUY CANDIDATE'&&x.opportunity>=82&&x.risk<=30&&x.confidence>=70){const d=meme?3:7;return{c:'strong',t:'BUY NOW SETUP',v:`Consider buying ${x.symbol} now; primary review/profit-taking window ${addDays(d)}. Exit earlier if opportunity <60, risk >45, confidence <50%, or signal downgrades.`}}if(x.action==='BUY CANDIDATE')return{c:'strong',t:'CONDITIONAL BUY',v:`Fresh-scan confirmation required before entry. Reassess within ${meme?'2–3':'3–5'} days; do not hold blindly.`};if(x.action==='AVOID')return{c:'stop',t:'AVOID / EXIT RISK',v:'Risk or weak evidence currently outweighs upside. Reconsider only after a materially stronger future scan.'};return{c:'wait',t:'WATCH / HOLD',v:`No new entry yet. Re-scan within ${meme?'24–48 hours':'2–3 days'} and upgrade only if opportunity/confidence improve while risk stays controlled.`}}
function categoryOptions(){const cats=[...new Set(items.flatMap(x=>x.categories||[]))].sort();$('#category').innerHTML='<option value="">All categories</option>'+cats.map(c=>`<option>${esc(c)}</option>`).join('');$('#category').style.display=(mode==='all'||mode==='meme')?'':'none'}
function filtered(){const q=$('#search').value.toLowerCase(),a=$('#action').value,c=$('#category').value;return items.filter(x=>(!q||String(x.symbol).toLowerCase().includes(q)||String(x.name).toLowerCase().includes(q))&&(!a||x.action===a)&&(!c||(x.categories||[]).includes(c)))}
function coinDetail(x){const p=plan(x);return `<div class="details"><div class="box"><b>Why ${esc(x.action||'WATCH')}</b><ul>${reasons(x).map(v=>`<li>${esc(v)}</li>`).join('')}</ul></div><div class="box ${p.c}"><b>${p.t}</b><div>${esc(p.v)}</div></div>${x.headlines?.length?`<div class="box"><b>Headlines</b>${x.headlines.slice(0,4).map(h=>`<div>• ${esc(h.title)}</div>`).join('')}</div>`:''}</div>`}
function renderCards(){const rows=filtered(),size=50,pages=Math.max(1,Math.ceil(rows.length/size));page=Math.min(page,pages);const shown=rows.slice((page-1)*size,page*size);$('#cards').innerHTML=shown.map(x=>`<div class="card" onclick="this.classList.toggle('open')"><div class="row"><div><div class="sym">${esc(x.symbol)}</div><div class="muted">${esc(x.name)}</div>${(x.categories||[]).slice(0,3).map(c=>`<span class="tag">${esc(c)}</span>`).join('')}</div><div><span class="pill ${cls(x.action)}">${esc(x.action)}</span></div><div><b>${x.opportunity}/100</b><div class="muted">Opportunity</div><div class="meter"><i style="width:${x.opportunity}%"></i></div></div><div><b>${x.risk}/100</b><div class="muted">Risk</div><div class="meter danger"><i style="width:${x.risk}%"></i></div></div><div class="hideMob"><b>${x.quality==null?'—':x.quality+'/100'}</b><div class="muted">Quality</div></div><div><b>${x.confidence}%</b><div class="muted">Confidence</div></div></div>${coinDetail(x)}</div>`).join('')||'<div class="card muted">No matching results.</div>';$('#pageInfo').textContent=`Page ${page}/${pages} • ${rows.length}`;$('#prev').disabled=page<=1;$('#next').disabled=page>=pages}
function renderTrending(){const rows=filtered();$('#cards').innerHTML=`<div class="card trendWrap"><table class="trendTable"><thead><tr><th>Trend</th><th>Coin</th><th>Market #</th><th>Price</th><th>1h</th><th>24h</th><th>7d</th><th>24h Vol</th><th>Market Cap</th><th>Signal</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="this.nextElementSibling?.classList.toggle('open')"><td>#${x.trendRank}</td><td><b>${esc(x.name)}</b> ${esc(x.symbol)}</td><td>${x.marketRank??'—'}</td><td>${esc(x.price??'—')}</td><td class="${pctClass(x.change1h)}">${esc(x.change1h??'—')}</td><td class="${pctClass(x.change24h)}">${esc(x.change24h??'—')}</td><td class="${pctClass(x.change7d)}">${esc(x.change7d??'—')}</td><td>${esc(x.volume24h??'—')}</td><td>${esc(x.marketCap??'—')}</td><td><span class="pill ${cls(x.action)}">${esc(x.action)}</span></td></tr><tr class="card"> <td colspan="10">${coinDetail(x)}</td></tr>`).join('')}</tbody></table></div>`;$('#pageInfo').textContent=`${rows.length} trending coins`;$('#prev').disabled=true;$('#next').disabled=true}
function render(){mode==='ph'||mode==='global'?renderTrending():renderCards()}
function stats(){const qs=items.map(x=>x.quality).filter(Number.isFinite);$('#count').textContent=items.length;$('#buys').textContent=items.filter(x=>x.action==='BUY CANDIDATE').length;$('#rugs').textContent=items.filter(x=>x.risk>=60).length;$('#quality').textContent=qs.length?Math.round(qs.reduce((a,b)=>a+b,0)/qs.length)+'/100':'—';$('#modeStat').textContent=mode==='ph'?'PH':mode==='global'?'Global':mode==='meme'?'Meme':'All'}
async function scan(){const b=$('#scan');b.disabled=true;b.textContent='Scanning…';$('#cards').innerHTML='<div class="card muted">Loading live public data…</div>';try{const u=(mode==='ph'||mode==='global')?`/trending?region=${mode}&force=1`:`/scan?mode=${mode}&force=1`;const r=await fetch(u),d=await r.json();if(!r.ok)throw new Error(d.error||'Scan failed');items=d.rows||d.tokens||[];scanTime=new Date(d.generatedAt);page=1;categoryOptions();stats();$('#stamp').textContent=scanTime.toLocaleString();render()}catch(e){$('#cards').innerHTML=`<div class="card neg">${esc(e.message)}</div>`}finally{b.disabled=false;b.textContent='Run Scan'}}
function setMode(m){mode=m;page=1;items=[];document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.mode===m));$('#subtitle').textContent=m==='ph'?'Popularity in the Philippines + market metrics + CryptoScope analysis':m==='global'?'Global crypto popularity + market metrics + CryptoScope analysis':m==='meme'?'Dedicated meme-token scanner + rug-risk analysis':'All-crypto scanner + opportunity, quality and risk';$('#search').value='';$('#action').value='';scan()}
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>setMode(t.dataset.mode));$('#scan').onclick=scan;$('#search').oninput=()=>{page=1;render()};$('#action').onchange=()=>{page=1;render()};$('#category').onchange=()=>{page=1;render()};$('#prev').onclick=()=>{if(page>1){page--;render()}};$('#next').onclick=()=>{page++;render()};scan();
</script></body></html>
